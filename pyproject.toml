[project]
name = "checkpoint-forensics-repro"
version = "0.1.0"
description = "Independent reproduction of GPU-layout fingerprints in published model weights"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forensics"]
